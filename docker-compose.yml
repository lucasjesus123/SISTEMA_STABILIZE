# =====================================================================
# Stabilize em produção, numa VPS.
#
# Três serviços e nada mais: banco, API e um proxy que termina TLS e
# serve o front. Cada peça a mais é uma peça a manter, atualizar e
# vigiar — com trinta empresas e noventa usuários simultâneos, isto
# aqui sobra.
#
# O QUE NÃO ESTÁ EXPOSTO: o PostgreSQL não publica porta. Ele fala com a
# API pela rede interna do compose e ponto. Publicar 5432 "para
# facilitar o acesso pelo DBeaver" é como a maioria dos vazamentos de
# banco começa. Para administrar, use um túnel SSH.
# =====================================================================

# O NOME DA GAVETA.
#
# Não é rótulo: o Docker prefixa com ele TODO contêiner, volume e rede
# deste sistema (stabilize_sistema-api-1, stabilize_sistema_dados-postgres,
# stabilize_sistema_interna). Numa VPS com vários sistemas, é o que
# permite olhar `docker ps` e saber de quem é cada coisa — e o que faz
# `docker compose down` daqui não encostar em nada dos outros.
name: stabilize_sistema

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stabilize}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:?defina no .env}"
      # AQUI NÃO VAI `LANG: pt_BR.UTF-8`, e a ausência é deliberada.
      #
      # A imagem oficial do PostgreSQL traz quatro locales e só: C,
      # C.utf8, en_US.utf8 e POSIX. Apontar o LANG para um que não existe
      # faz o initdb recusar ANTES de criar o cluster:
      #
      #   initdb: error: invalid locale settings; check LANG and LC_*
      #
      # O contêiner morre, o Docker reinicia, morre de novo. O sintoma é
      # "restarting/unhealthy" para sempre, sem o banco jamais ter
      # subido — e a mensagem fica enterrada num log que se repete.
      # Aconteceu na primeira instalação real.
      #
      # A intenção daquela linha era ordenar nome acentuado direito
      # ("Álvaro" perto de "Alvaro", e não depois de "Zeca"). O padrão da
      # imagem, en_US.utf8, já faz isso: é collation UTF-8 sensível a
      # acento. Quem estraga a ordenação é a collation C, que não é a
      # nossa. Ou seja: o objetivo estava certo e o meio, errado.
      #
      # Para ordenação estritamente brasileira o caminho é ICU, que vem
      # compilado no PostgreSQL 16 e não depende de locale do sistema
      # operacional — `ORDER BY nome COLLATE "pt-BR-x-icu"` funciona sem
      # mudar nada aqui. Fica como refinamento, não como pré-requisito.
    command:
      - postgres
      # Nunca 'all': o 002_roles.sql executa CREATE ROLE ... PASSWORD, e
      # com log_statement=all a senha do banco vai parar no log em texto
      # claro. 'ddl' teria o mesmo problema.
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=500
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Sem `ports:` — ver o cabeçalho.
    networks: [interna]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: "${DATABASE_URL:?defina no .env}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?defina no .env}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?defina no .env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?defina no .env}"
      CORS_ORIGINS: "${CORS_ORIGINS:?defina no .env}"
      STORAGE_DIR: /app/storage
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UAZAPI_BASE_URL: ${UAZAPI_BASE_URL:-}
      UAZAPI_ADMIN_TOKEN: ${UAZAPI_ADMIN_TOKEN:-}
    volumes:
      - anexos:/app/storage
    # Endurecimento do contêiner. Nada aqui é teórico: cada linha fecha
    # um caminho que já foi usado em incidente real.
    read_only: true              # nada escreve fora dos volumes
    tmpfs:
      - /tmp:size=64m,mode=1777  # uploads em trânsito
    security_opt:
      - no-new-privileges:true   # nem via binário setuid
    cap_drop: [ALL]              # a API não precisa de capability nenhuma
    healthcheck:
      # Forma exec (CMD, não CMD-SHELL): sem shell no meio, não há aspas
      # para escapar. A imagem slim não tem curl nem wget; o próprio node
      # faz a requisição.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [interna, borda]

  # Roda uma vez, aplica as migrations e sai. `profiles` mantém este
  # serviço FORA do `docker compose up -d`: ele não é um processo do
  # sistema, é uma ferramenta. Sem isso, todo restart da VPS tentaria
  # reaplicar DDL enquanto a API sobe.
  #
  #   docker compose run --rm migrate
  #
  # A imagem tem psql; a da API não tem, de propósito (ver o Dockerfile).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    profiles: [ferramentas]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Credencial de MIGRAÇÃO (dona do schema), nunca a da API.
      DATABASE_MIGRATION_URL: "${DATABASE_MIGRATION_URL:?defina no .env}"
      STABILIZE_APP_PASSWORD: "${STABILIZE_APP_PASSWORD:?defina no .env}"
      STABILIZE_MIGRATOR_PASSWORD: "${STABILIZE_MIGRATOR_PASSWORD:?defina no .env}"
      # A de superusuário é usada por UM arquivo só, o 000_roles.sql, que
      # cria os papéis — `CREATE ROLE` exige superusuário, e é ele que
      # cria justamente o `stabilize_migrator`. O migrate.sh monta a URL
      # a partir destas duas e da de migração; ver o cabeçalho dele.
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERUSER_PASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:?defina no .env}"
    networks: [interna]

  # Popula uma academia de DEMONSTRAÇÃO, separada da real: 30 alunos com
  # contratos, agenda de verdade, presenças, mensalidades pagas e em
  # atraso, treinos e prontuário. Serve para navegar o sistema com
  # informação em todas as telas — e para ver o isolamento funcionando,
  # já que as duas academias convivem no mesmo banco sem se enxergar.
  #
  #   docker compose run --rm -e SEED_FORCE=sim seed
  #
  # `SEED_FORCE` é exigido porque o script se recusa a rodar num banco
  # que já tem empresa de verdade — e aqui tem a sua. Ele apaga e recria
  # SÓ a academia de demonstração, que tem id fixo; a real não é tocada.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: seed
    profiles: [ferramentas]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # A credencial de MIGRAÇÃO: o seed escreve em todas as tabelas e
      # precisa definir o contexto de empresa a cada transação. A da API
      # serviria, mas esta é a que já tem o schema como dona.
      DATABASE_URL: "${DATABASE_MIGRATION_URL:?defina no .env}"
    networks: [interna]

  # Cria o operador da PLATAFORMA — quem cadastra academias, nomeia os
  # administradores delas e liga o WhatsApp. Não é usuário de academia
  # nenhuma; mora numa tabela própria, fora da matriz de papéis.
  #
  #   docker compose run --rm operador "voce@exemplo.com" "Seu Nome"
  #
  # Roda uma vez e sai. `profiles` o mantém fora do `up` — lembre que o
  # perfil também o exclui do `build`; use `deploy/atualizar.sh`, que já
  # constrói com `--profile ferramentas`.
  operador:
    build:
      context: .
      dockerfile: Dockerfile
      target: seed
    profiles: [ferramentas]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # A credencial de MIGRAÇÃO: escrever em `platform_admins` exige um
      # papel que a API não tem — ela recebe `permission denied` nessa
      # tabela, de propósito.
      DATABASE_MIGRATION_URL: "${DATABASE_MIGRATION_URL:?defina no .env}"
    entrypoint: ["node", "packages/db/scripts/criar-operador.mjs"]
    networks: [interna]

  proxy:
    # O front vai DENTRO desta imagem (estágio `web` do Dockerfile), e
    # não montado do disco: `apps/web/dist` não existe num clone novo,
    # porque está no .gitignore e a build acontece dentro do Docker.
    # Montá-lo dava um diretório vazio, e o site subia em branco com
    # todos os serviços "healthy". Ver o comentário no Dockerfile.
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on: [api]
    # AS PORTAS SÃO VARIÁVEIS, e isto é o que torna a VPS compartilhável.
    #
    # Fixar '80:80' significa tomar a porta 80 da MÁQUINA INTEIRA. Numa
    # VPS que já hospeda outros sistemas, ou este contêiner não sobe
    # ("address already in use"), ou sobe primeiro e derruba o vizinho no
    # próximo reboot. Nos dois casos o estrago é em sistema que não é
    # este.
    #
    # Dois modos, escolhidos pelo .env (o gerar-segredos.sh pergunta):
    #
    #   BORDA    — nada mais usa 80/443. Nosso Caddy fica na borda e
    #              emite o certificado. PORTA_HTTP=80, PORTA_HTTPS=443.
    #
    #   INTERNO  — já existe um proxy na frente (nginx, Traefik, outro
    #              Caddy). Publicamos SÓ no loopback, em porta alta, e o
    #              proxy de vocês encaminha para cá. Nada nosso aparece
    #              na internet direto. Ex.: PORTA_HTTP=127.0.0.1:8080.
    ports:
      - '${PORTA_HTTP:-80}:80'
      - '${PORTA_HTTPS:-443}:443'
      - '${PORTA_HTTPS:-443}:443/udp'   # HTTP/3, usado no modo borda
    environment:
      # No modo borda é o domínio (o Caddy emite TLS sozinho). No modo
      # interno é ':80', que serve HTTP puro para o proxy da frente —
      # tentar emitir certificado sem a porta 80 pública falharia em laço.
      ENDERECO_CADDY: "${ENDERECO_CADDY:?defina no .env (domínio no modo borda, ':80' no modo interno)}"
      # `:-` (com dois-pontos) usa o padrão quando a variável está VAZIA,
      # e não só quando ela não existe. A diferença derrubou o proxy na
      # primeira instalação: no modo interno o .env traz `EMAIL_TLS=`
      # (vazio, porque não há certificado a emitir), o Caddyfile recebia
      # `email` sem argumento nenhum e falhava no parse — em laço.
      #
      # O `{$VAR:padrão}` do próprio Caddy NÃO resolve isto: lá o padrão
      # só vale para variável inexistente. Foi exatamente o que passou
      # pelo meu teste, que usava `env -u`.
      EMAIL_TLS: "${EMAIL_TLS:-tls-nao-usado-no-modo-interno@exemplo.invalid}"
    volumes:
      # O Caddyfile continua vindo do disco: é configuração que o
      # operador pode querer ajustar sem refazer a imagem. Os arquivos
      # do front, não — eles têm que casar com o commit que gerou a
      # imagem, e por isso são assados nela.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data      # certificados — PERDER ISSO refaz a emissão
      - caddy-config:/config
    networks: [borda]

volumes:
  dados-postgres:
  anexos:
  caddy-dados:
  caddy-config:

networks:
  # O banco só existe na rede interna; o proxy só na de borda. A API é a
  # única nas duas, porque é a única que precisa das duas.
  interna:
    internal: true
  borda:
