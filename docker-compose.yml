services:
  postgres:
    image: postgres:16-alpine
    container_name: stabilize-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stabilize}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Sem valor padrão de propósito: a ausência da variável deve
      # quebrar o start, não subir um banco com senha previsível.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    ports:
      # Só no loopback. Publicar 5432 na interface pública expõe o banco
      # à internet, e é assim que a maioria dos vazamentos de VPS começa.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stabilize}']
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=America/Sao_Paulo

volumes:
  pgdata:
